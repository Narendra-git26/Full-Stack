<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in page</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Comapany</a>
            <ul class="navbar-nav flex-row me-auto">
                <li class="nav-item">
                    <a class="nav-link ms-2" href="">Log in Page</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container">

        <div class="p-3 mb-3 rounded-3 bg-info">
            <h1 class="display-5 fw-bold">Log In</h1>
            <p>Enter Your Email and Password in the fields below</p>
        </div>

        <form action="index.html">
            <div class="form-group mb-3">
                <label for="enteremail" class="form-label">Email Address
                    <input class="form-control" id="enteremail" type="email" placeholder="Email" name="" required>
                </label>
            </div>
            <div class="form-group mb-3">
                <label for="enterpass" class="form-label">Password
                    <input class="form-control" id="enterpass" type="password" placeholder="password" name="" required>
                </label>
            </div>
            <div>
                <button type="submit" class="btn-btn-success rounded">Submit</button>
            </div>
        </form>
        
    </div>


    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
