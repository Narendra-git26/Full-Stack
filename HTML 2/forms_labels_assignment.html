<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Assignment</title>
</head>
<body>
    <h1>Course sign up Page</h1>
    <p>Please note First name, Last name, Password, and Email required</p>
    <form action="thankyou.html" method="get">

        <label for="fname">First name: </label>
        <input id="fname" type="text" name="" placeholder="First name" required>


        <label for="lname">Last name: </label>
        <input id="lname" type="text" name="" placeholder="Last name" required>

        <p></p>


        <label for="email">Email:</label>
        <input id="email" type="email" name="" placeholder="name@gmail.com" required>
        <label for="pass">password: </label>
        <input id="pass" type="password" name="" placeholder="Min 8 characters" required>

        <p>Are you over the age 18?</p>

        <label for="yes">Yes: </label>
        <input id="yes" type="radio" name="loc" value="" required>

        <label for="no">No: </label>
        <input id="no" type="radio" name="loc" value="" required>

        <label for="maybe">maybe: </label>
        <input id="maybe" type="radio" name="loc" value="" required>

        <p>Do you have credit card or Paypal</p>

        <select name="card payment" id="">
            <option value="credit card">credit card</option>
            <option value="paypal">Paypal</option>     
        </select>

        <p></p>

        <input type="submit" name="" value="sign up">
    </form>


</body>
</html>
