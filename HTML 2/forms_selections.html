<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Feedback</title>
</head>
<body>
    <h1>Hotel Feedback Form</h1>
    <form action="" method="get">
        <h3>Are you from inside usa or outside usa</h3>
        <label for="inus"> Inside usa:</label>
        <input id="inus" type="radio" name="loc" value="inside">

        <label for="outside"> outside usa:</label>
        <input id="outside" type="radio" name="loc" value="outside">

        <h2> How was your service</h2>

        <select name="stars" id="">
            <option value="great">3</option>
            <option value="okay">2</option>
            <option value="bad">1</option>
        </select>
        <input type="submit" name="" value="submit">

        <h2>Any other Feedback</h2>
        <textarea name="mytext" rows="10" cols="40" id=""></textarea>
    </form>
</body>
</html>
